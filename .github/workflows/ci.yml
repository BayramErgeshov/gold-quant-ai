# GOLD QUANT AI — CI pipeline.
# Mirrors TESTING_STRATEGY.md "Automated Pipeline": lint -> typing -> unit ->
# integration -> security -> build. No feature merges without a green pipeline.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POETRY_VERSION: "1.8.3"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Install dependencies
        run: poetry install --no-interaction --with dev
      - name: Ruff check
        run: poetry run ruff check src tests
      - name: Ruff format check
        run: poetry run ruff format --check src tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Install dependencies
        run: poetry install --no-interaction --with dev
      - name: mypy
        run: poetry run mypy src

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Install dependencies
        run: poetry install --no-interaction --with dev
      - name: Bandit
        run: poetry run bandit -r src -q
      - name: pip-audit (dependency vulnerability scan)
        run: poetry run pip-audit --strict --progress-spinner=off

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gold_quant_ai
          POSTGRES_USER: gold_quant_ai
          POSTGRES_PASSWORD: gold_quant_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gold_quant_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
    env:
      GOLD_ENVIRONMENT: testing
      POSTGRES_HOST: localhost
      POSTGRES_DB: gold_quant_ai
      POSTGRES_USER: gold_quant_ai
      POSTGRES_PASSWORD: gold_quant_ai
      REDIS_HOST: localhost
      QDRANT_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Install dependencies
        run: poetry install --no-interaction --with dev
      - name: Run database migrations
        run: poetry run alembic upgrade head
      - name: Check CURRENT_STATE.md is up to date
        env:
          PYTHONPATH: .
        run: |
          poetry run python scripts/generate_current_state.py
          git diff --exit-code CURRENT_STATE.md
      - name: Run tests
        run: poetry run pytest --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gold-quant-ai:${{ github.sha }} .
