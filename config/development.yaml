  technical: true
  macro: true
  news: true
  risk: true
  execution: true
  historical: true
  book: true
  machine_learning: true
  learning: true
  statistics: true
  workflow: true
  monitoring: true
  database: true
  telegram: true
  mt5: true

data_sources_enabled:
  market_data: true
  news: true
  macro: true
  books: true
  historical: true
  machine_learning: true
  research: true

execution:
  execution_enabled: true
  demo_only: true
  live_enabled: false
  pending_orders_enabled: true
  market_orders_enabled: true
  partial_close_enabled: true
  trailing_enabled: true
  break_even_enabled: true

logging:
