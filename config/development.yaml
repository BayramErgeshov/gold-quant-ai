# Environment profile: development
# Per CONFIGURATION.md — global toggles for local development.

environment: development

symbols:
  primary: XAUUSD
  enabled:
    - XAUUSD
  # Disabled pending future expansion (ARCHITECTURE.md: Future Expansion)
  reserved:
    - EURUSD
    - GBPUSD
    - USDJPY
    - BTCUSD
    - ETHUSD
    - SP500
    - NASDAQ
    - US30
